        "cohort_flow_table",
        "weighted_descriptive_table",
        "primary_model_table",
        "methods_and_limitations_report"
      ],
      "derivedDefinitions": [
        {
          "id": "measured_hypertension",
          "label": "Measured hypertension",
          "expression": "mean available systolic BP >= 130 mmHg or mean available diastolic BP >= 80 mmHg",
          "variables": [
            "BPXDI1",
            "BPXDI2",
            "BPXDI3",
            "BPXSY1",
            "BPXSY2",
            "BPXSY3"
          ],
          "role": "endpoint"
        }
