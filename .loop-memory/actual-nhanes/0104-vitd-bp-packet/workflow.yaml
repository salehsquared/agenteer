      ],
      "approvedDataInputs": [
        "demographics",
        "vitamin_d",
        "blood_pressure"
      ],
      "surveyDesign": {
        "weightRule": "mec",
        "weightVariable": "WTMEC2YR",
        "strataVariable": "SDMVSTRA",
        "psuVariable": "SDMVPSU"
